name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate repository structure
        run: python tools/validate_repo.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile helper
        run: python -m py_compile skill/trilium-knowledge-sync/scripts/trilium_etapi.py

      - name: Check Bash syntax
        run: bash -n install.sh

  release:
    needs: validate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build source archive
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          archive="trilium-knowledge-sync-${tag}.zip"
          git archive --format=zip --output="$archive" HEAD
          sha256sum "$archive" > "${archive}.sha256"
          ls -lh "$archive" "${archive}.sha256"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          archive="trilium-knowledge-sync-${tag}.zip"
          gh release create "$tag" "$archive" "${archive}.sha256" \
            --title "trilium-knowledge-sync ${tag}" \
            --notes-file CHANGELOG.md
